<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poker Odds Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e2e2e2;--card:#fff;--ink:#14261c;--mute:#5b7266;--acc:#a97b00;--red:#d11;--ok:#1a8a3d;--line:#cddbd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1f17;--card:#173025;--ink:#eef5f0;--mute:#9db5a8;--acc:#e8c45a;--line:#2b4a3b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot{width:52px;height:72px;border-radius:8px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:transparent;color:var(--ink);cursor:pointer}
.slot.f{background:#fff;color:#111;border-style:solid;border-color:#ccc}
.slot.f.suit-d{color:#1554d6}
.slot.f.suit-h{color:#d11}
.slot.f.suit-c{color:#1a8a3d}
.slot.f.suit-s{color:#111}
.slot.sel{outline:3px solid var(--acc)}
.gap{width:10px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--acc);color:#1a1400;font-weight:700;cursor:pointer}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:8px}
.grid button{padding:8px 0;font-size:13px;border-radius:6px;background:#fff;color:#111;border:1px solid #ccc}
.grid button.suit-d{color:#1554d6}
.grid button.suit-h{color:#d11}
.grid button.suit-c{color:#1a8a3d}
.grid button.suit-s{color:#111}
.grid button:disabled{opacity:.2}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
input[type=number]{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font-size:34px;font-weight:800;margin:2px 0}
.rec{font-size:28px;font-weight:800;padding:10px;border-radius:10px;text-align:center;margin:8px 0}
.BET,.RAISE,.CALL{background:rgba(95,214,138,.18);color:var(--ok)}
.CHECK{background:rgba(232,196,90,.18);color:var(--acc)}
.FOLD{background:rgba(255,107,107,.18);color:var(--red)}
.mute{color:var(--mute);font-size:13px;line-height:1.4}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
#msg{font-size:13px;color:var(--acc);min-height:18px;margin-top:6px}
#prev{width:52px;height:52px;object-fit:cover;border-radius:8px;display:none;border:1px solid var(--line)}
.blist{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.blist:last-child{border-bottom:none}
.blist b{font-weight:700;color:var(--ink)}
.oddsTable{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.oddsTable th,.oddsTable td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.oddsTable th:last-child,.oddsTable td:last-child,.oddsTable th:nth-child(2),.oddsTable td:nth-child(2){text-align:right}
.sec.active{background:var(--acc);color:#1a1400;border-color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>♠ Poker Odds Coach</h1>

<section>
<h2>Game</h2>
<div class="row" id="gameRow">
<button class="sec active" data-game="holdem">Hold'em</button>
<button class="sec" data-game="omaha">Omaha (4 cards)</button>
</div>
</section>

<section>
<h2>Scan the table</h2>
<div class="row">
<label class="btn" for="cam" id="scanBtn">📷 Take photo</label>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<img id="prev" alt="">
<span class="mute">Photo your hand and the board together, then confirm below.</span>
</div>
<div class="row" style="margin-top:8px"><button class="sec" id="live">🎥 Live camera</button><input id="code" type="password" placeholder="Access code" style="flex:1;min-width:120px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)"></div>
<video id="vid" playsinline muted style="display:none;width:100%;border-radius:8px;margin-top:8px"></video>
<button id="snap" style="display:none;margin-top:8px;width:100%">Capture &amp; read cards</button>
<div id="msg"></div>
</section>

<section>
<h2>Your hand</h2>
<div class="row" id="hole"></div>
<h2 style="margin-top:12px">Board</h2>
<div class="row" id="board"></div>
<div class="row" style="margin-top:8px"><button class="sec" id="manualBtn">⌨️ Enter cards manually</button></div>
<div class="grid" id="grid"></div>
<div class="row" style="margin-top:8px"><button class="sec" id="clear">Clear all</button></div>
</section>

<section>
<h2>Situation</h2>
<div class="cols">
<div><label>Opponents</label><input type="number" id="opp" value="1" min="1" max="9"></div>
<div><label>Pot (incl. bets)</label><input type="number" id="pot" value="0" min="0"></div>
<div><label>To call</label><input type="number" id="call" value="0" min="0"></div>
</div>
<div class="row" style="margin-top:12px"><button id="go" style="flex:1">Calculate</button></div>
</section>

<section id="out" style="display:none">
<h2>Result</h2>
<div class="big" id="eq"></div>
<div class="bar"><i id="eqbar"></i></div>
<div class="mute" id="det"></div>
<div class="mute" id="eqwhy" style="margin-top:4px"></div>
<div class="rec" id="rec"></div>
<div class="mute" id="why"></div>
<div class="mute" id="better" style="margin-top:6px"></div>
<div class="mute" id="odds"></div>
</section>

<p class="mute">Estimates use random-opponent simulation and don't read opponents' tendencies. Check that your card room or game allows device use before relying on this.</p>
</main>

<script>
const R="23456789TJQKA",S="cdhs",SYM={c:"♣",d:"♦",h:"♥",s:"♠"};
let game="holdem";
const holeCount=()=>game==="omaha"?4:2;
// slots: 0..holeCount-1 hole, then 5 board. values: card int (rank*4+suit) or null
let slots=Array(holeCount()+5).fill(null);let sel=0;let manual=false;
const $=id=>document.getElementById(id);
const name=c=>R[c>>2]+SYM[S[c&3]];
const isRed=c=>{const s=S[c&3];return s==="d"||s==="h"};
const suitClass=c=>"suit-"+S[c&3];
function parse(t){if(typeof t!=="string"||t.length<2)return null;const r=R.indexOf(t[0].toUpperCase().replace("1","T")),s=S.indexOf(t[t.length-1].toLowerCase());return r<0||s<0?null:r*4+s}

function render(){
  const hc=holeCount();
  const mk=(i)=>{const c=slots[i];return `<div class="slot${c!=null?" f "+suitClass(c):""}${sel===i?" sel":""}" data-i="${i}">${c!=null?name(c):""}</div>`};
  $("hole").innerHTML=Array.from({length:hc},(_,i)=>mk(i)).join("");
  const b=hc;
  $("board").innerHTML=[b,b+1,b+2].map(mk).join("")+'<div class="gap"></div>'+mk(b+3)+'<div class="gap"></div>'+mk(b+4);
  document.querySelectorAll(".slot").forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(sel===i&&slots[i]!=null)slots[i]=null;sel=i;manual=true;render()});
  let g="";
  for(let s=3;s>=0;s--)for(let r=12;r>=0;r--){const c=r*4+s;g+=`<button class="${suitClass(c)}" data-c="${c}" ${slots.includes(c)?"disabled":""}>${R[r]}${SYM[S[s]]}</button>`}
  $("grid").innerHTML=g;
  $("grid").style.display=(manual&&slots[sel]==null)?"":"none";
  $("manualBtn").style.display=manual?"none":"";
  document.querySelectorAll("#grid button").forEach(b=>b.onclick=()=>{
    slots[sel]=+b.dataset.c;const n=slots.findIndex(x=>x==null);sel=n<0?sel:n;render()});
}
$("manualBtn").onclick=()=>{manual=true;sel=Math.max(0,slots.findIndex(x=>x==null));render()};
$("clear").onclick=()=>{slots.fill(null);sel=0;$("out").style.display="none";render()};
document.querySelectorAll("#gameRow button").forEach(b=>b.onclick=()=>{
  if(b.dataset.game===game)return;
  game=b.dataset.game;
  document.querySelectorAll("#gameRow button").forEach(x=>x.classList.toggle("active",x===b));
  slots=Array(holeCount()+5).fill(null);sel=0;manual=false;$("out").style.display="none";render();
});

// ---- evaluator (7 cards -> score) ----
function st(m){for(let h=12;h>=4;h--)if(((m>>(h-4))&31)===31)return h;return (m&0x100F)===0x100F?3:-1}
const pack=a=>{let v=0;for(let i=0;i<5;i++)v=v*13+(a[i]||0);return v};
function ev(cs){
  const rc=new Array(13).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let all=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sc[s]++;sm[s]|=1<<r;all|=1<<r}
  const K=371293;let fm=0;for(let s=0;s<4;s++)if(sc[s]>=5)fm=sm[s];
  if(fm){const h=st(fm);if(h>=0)return 8*K+pack([h])}
  const q=[],t=[],p=[],o=[];
  for(let r=12;r>=0;r--){const n=rc[r];if(n===4)q.push(r);else if(n===3)t.push(r);else if(n===2)p.push(r);else if(n===1)o.push(r)}
  if(q.length){const k=Math.max(...[...t,...p,...o].filter(x=>x!==q[0]),...(q[1]!=null?[q[1]]:[]));return 7*K+pack([q[0],k])}
  if(t.length&&(t.length>1||p.length)){const s2=Math.max(t[1]??-1,p[0]??-1);return 6*K+pack([t[0],s2])}
  if(fm){const top=[];for(let r=12;r>=0&&top.length<5;r--)if(fm>>r&1)top.push(r);return 5*K+pack(top)}
  const h=st(all);if(h>=0)return 4*K+pack([h]);
  if(t.length)return 3*K+pack([t[0],o[0],o[1]]);
  if(p.length>1){const k=Math.max(p[2]??-1,o[0]??-1);return 2*K+pack([p[0],p[1],k])}
  if(p.length)return 1*K+pack([p[0],o[0],o[1],o[2]]);
  return pack(o.slice(0,5));
}
const CAT=["High card","Pair","Two pair","Three of a kind","Straight","Flush","Full house","Four of a kind","Straight flush"];
const HANDK=371293;

const HOLE_PAIRS_4=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
function combos3(arr){const n=arr.length,res=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++)res.push([arr[i],arr[j],arr[k]]);return res}
function evOmaha(hole,board){
  let best=-1;
  const triples=combos3(board);
  for(const [i,j] of HOLE_PAIRS_4){
    const pair=[hole[i],hole[j]];
    for(const t of triples){const s=ev(pair.concat(t));if(s>best)best=s}
  }
  return best;
}
function bestScore(hole,board,game){
  if(game==="omaha"){ if(board.length<3) return -1; return evOmaha(hole,board) }
  return ev(hole.concat(board));
}

function simulate(hole,board,opps,N,game){
  const hc=holeCount();
  const used=new Set([...hole,...board]);const deck=[];for(let c=0;c<52;c++)if(!used.has(c))deck.push(c);
  const need=5-board.length,dl=deck.length;let win=0,tie=0,tieHands=0,lose=0;
  const oppCat=new Array(9).fill(0);
  for(let n=0;n<N;n++){
    const k=need+opps*hc;
    for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(dl-i));const x=deck[i];deck[i]=deck[j];deck[j]=x}
    const full=board.concat(deck.slice(0,need));
    const me=bestScore(hole,full,game);let best=-1,cnt=0;
    for(let o=0;o<opps;o++){const oh=deck.slice(need+o*hc,need+o*hc+hc);const s=bestScore(oh,full,game);if(s>best){best=s;cnt=1}else if(s===best)cnt++}
    if(best>=0)oppCat[Math.floor(best/HANDK)]++;
    if(me>best)win++;else if(me===best){tie+=1/(cnt+1);tieHands++}else lose++;
  }
  return {eq:(win+tie)/N,oppCat,N,win,tie,tieHands,lose};
}

function outsAnalysis(hole,board,game){
  const used=new Set([...hole,...board]);const deck=[];for(let c=0;c<52;c++)if(!used.has(c))deck.push(c);
  const res={};
  if(board.length===3){
    const turnC=new Array(9).fill(0);
    for(const t of deck){const cat=Math.floor(bestScore(hole,board.concat([t]),game)/HANDK);turnC[cat]++}
    res.turn={counts:turnC,total:deck.length};
    const riverC=new Array(9).fill(0);let tot=0;
    for(let i=0;i<deck.length;i++)for(let j=i+1;j<deck.length;j++){const cat=Math.floor(bestScore(hole,board.concat([deck[i],deck[j]]),game)/HANDK);riverC[cat]++;tot++}
    res.river={counts:riverC,total:tot};
  }else if(board.length===4){
    const riverC=new Array(9).fill(0);
    for(const r of deck){const cat=Math.floor(bestScore(hole,board.concat([r]),game)/HANDK);riverC[cat]++}
    res.river={counts:riverC,total:deck.length};
  }
  return res;
}
function oddsTableHtml(title,counts,total){
  const items=[];
  for(let i=8;i>=0;i--){
    if(!counts[i])continue;
    const pct=counts[i]/total*100;
    items.push({hand:CAT[i],outs:counts[i],pct});
  }
  items.sort((a,b)=>b.pct-a.pct);
  const rows=items.map(it=>`<tr><td>${it.hand}</td><td>${it.outs}</td><td>${it.pct<0.1?"<0.1":it.pct.toFixed(1)}%</td></tr>`).join("");
  return `<div style="font-weight:700;margin-top:10px;margin-bottom:2px">${title}</div><table class="oddsTable"><thead><tr><th>Resulting hand</th><th>Outs</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>`;
}

$("go").onclick=()=>{
  const hc=holeCount();
  const hole=slots.slice(0,hc).filter(x=>x!=null),board=slots.slice(hc).filter(x=>x!=null);
  if(hole.length<hc){toast(`Pick all ${hc} of your hole cards first.`);return}
  if(![0,3,4,5].includes(board.length)){toast("Board should have 0, 3, 4 or 5 cards.");return}
  const opps=Math.min(9,Math.max(1,+$("opp").value||1)),pot=+$("pot").value||0,call=+$("call").value||0;
  $("go").disabled=true;$("go").textContent="Calculating…";
  setTimeout(()=>{
    const N=board.length===0?(game==="omaha"?6000:12000):(game==="omaha"?10000:20000);
    const sim=simulate(hole,board,opps,N,game);
    const eq=sim.eq;
    const fair=1/(opps+1);let rec,why;
    let madeIdx=-1,betterHtml="",oddsHtml="";
    const winPct=sim.win/sim.N*100,tiePct=sim.tieHands/sim.N*100;
    const remainingBoard=5-board.length;
    const dealPart=remainingBoard>0?`${opps} random opponent hand${opps>1?"s":""} and the remaining ${remainingBoard} board card${remainingBoard>1?"s":""}`:`${opps} random opponent hand${opps>1?"s":""}`;
    const tieShareStr=sim.tie.toFixed(1);
    const equityWhy=`Equity is estimated by Monte Carlo simulation: we dealt out ${dealPart} from the rest of the deck and played the hand to showdown, ${N.toLocaleString()} times. You won outright in ${sim.win.toLocaleString()} of those ${N.toLocaleString()} simulations (${winPct.toFixed(1)}%)${sim.tieHands?`, and split the pot in a tie in another ${sim.tieHands.toLocaleString()} (${tiePct.toFixed(1)}%, worth ${tieShareStr} tie-share${sim.tie>=2?"s":""} once divided evenly among everyone who tied)`:""}. Equity = (wins + tie shares) ÷ simulations = (${sim.win.toLocaleString()} + ${tieShareStr}) ÷ ${N.toLocaleString()} = ${(eq*100).toFixed(1)}%.`;
    if(board.length>=3){
      madeIdx=Math.floor(bestScore(hole,board,game)/371293);
      const betterIdx=[];for(let i=8;i>madeIdx;i--)betterIdx.push(i);
      if(betterIdx.length){
        const items=betterIdx.map(i=>({hand:CAT[i],pct:sim.oppCat[i]/sim.N*100}));
        items.sort((a,b)=>b.pct-a.pct);
        const rows=items.map(it=>`<div class="blist"><span>${it.hand}</span><b>${it.pct<0.1&&it.pct>0?"<0.1":it.pct.toFixed(1)}%</b></div>`).join("");
        betterHtml=`<div style="font-weight:700;margin-bottom:2px">Better hands possible (chance an opponent has it):</div>${rows}`;
      }else{
        betterHtml="You already have the top hand category — nothing beats "+CAT[madeIdx]+".";
      }
      const oa=outsAnalysis(hole,board,game);
      if(oa.turn||oa.river){
        oddsHtml=`<div>Your current hand is ${CAT[madeIdx]}. Here's exactly how it can improve as the remaining board cards come:</div>`;
        if(oa.turn)oddsHtml+=oddsTableHtml(`Turn card (${oa.turn.total} cards left)`,oa.turn.counts,oa.turn.total);
        if(oa.river)oddsHtml+=oddsTableHtml(board.length===3?`By the river (both cards to come, ${oa.river.total} combinations)`:`River card (${oa.river.total} cards left)`,oa.river.counts,oa.river.total);
      }
    }
    // Absolute hand strength, independent of the Monte Carlo equity number:
    // a full house or better is a strong made hand almost regardless of how
    // many opponents are in, so let it push the recommendation up even when
    // the raw equity math alone wouldn't clear the usual threshold.
    const strongAbsolute=madeIdx>=6;   // full house, quads, straight flush
    const nutAbsolute=madeIdx>=7;      // quads or straight flush
    if(call>0){
      const need=call/(pot+call);
      why=`Equity needed = call ÷ (pot + call) = ${call} ÷ (${pot} + ${call}) = ${(need*100).toFixed(1)}%. That's the break-even point: call this often (in equivalent spots) and you win back exactly what you put in. Simulation gives you about ${(eq*100).toFixed(0)}% equity here, so `;
      if(nutAbsolute||(eq>need+0.25&&eq>0.6))rec="RAISE";else if(strongAbsolute||eq>=need+0.03)rec="CALL";else if(eq>=need-0.03&&board.length<5)rec="CALL";else rec="FOLD";
      why+=eq>=need?`you're above the ${(need*100).toFixed(1)}% you need — calling profits on average.`:`you're below the ${(need*100).toFixed(1)}% you need — calling loses on average.`;
      if(strongAbsolute)why+=` On top of that, you've made ${CAT[madeIdx].toLowerCase()} — a strong absolute hand in its own right, worth playing aggressively even if the equity math alone looked marginal.`;
      else if(rec==="CALL"&&eq<need+0.03)why+=" It's marginal; drawing hands with future bets can justify it.";
    }else{
      const fairPct=(fair*100).toFixed(1);
      const fairCalc=`an even share = 1 ÷ (opponents + 1) = 1 ÷ (${opps} + 1) = ${fairPct}%`;
      if(strongAbsolute){rec="BET";why=`You've made ${CAT[madeIdx].toLowerCase()} — a strong absolute hand regardless of the exact equity number. Bet for value, roughly half to two-thirds of the pot.`}
      else if(eq>Math.max(0.6,fair+0.2)){rec="BET";why=`Well ahead of ${fairCalc}. Bet for value, roughly half to two-thirds of the pot.`}
      else if(eq>fair+0.08&&board.length<5){rec="BET";why=`Ahead of ${fairCalc}. A modest bet builds the pot and denies free cards.`}
      else{rec="CHECK";why=`Not clearly ahead of ${fairCalc}. Check and see the next card cheaply.`}
    }
    $("out").style.display="block";
    $("eq").textContent=(eq*100).toFixed(1)+"% to win";
    $("eqbar").style.width=(eq*100)+"%";
    $("eqwhy").textContent=equityWhy;
    $("det").textContent=`Hand: ${hole.map(name).join(" ")}${board.length?" | Board: "+board.map(name).join(" "):" (preflop)"} vs ${opps} random opponent${opps>1?"s":""}.`;
    $("rec").className="rec "+rec;$("rec").textContent=rec;$("why").textContent=why;
    $("better").innerHTML=betterHtml;
    $("odds").innerHTML=oddsHtml;
    if(madeIdx>=0)$("det").textContent+=` Your hand: ${CAT[madeIdx]}.`;
    $("go").disabled=false;$("go").textContent="Calculate";
    $("out").scrollIntoView({behavior:"smooth"});
  },30);
};

function toast(t){$("msg").textContent=t}

// ---- photo scan via server function ----
const K="pc_code";try{$("code").value=localStorage.getItem(K)||""}catch(e){}
$("code").onchange=()=>{try{localStorage.setItem(K,$("code").value)}catch(e){}};
function shrink(blob){
  // Omaha shows 4 hole cards in the space Hold'em uses for 2, so each card
  // (and its suit glyph) is roughly half the size on screen - use a higher
  // resolution cap for Omaha so suits stay legible.
  const maxDim=game==="omaha"?2200:1600;
  return createImageBitmap(blob).then(bm=>{const s=Math.min(1,maxDim/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.92).split(",")[1]})}
async function scan(blob){
  toast("Reading cards…");
  try{
    const image=await shrink(blob);
    const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json","x-passcode":$("code").value},body:JSON.stringify({image,game})});
    if(r.status===401){toast("Wrong access code.");return}
    const d=await r.json();
    if(!r.ok){toast("Scan error: "+(d.error||r.status)+(d.detail?" — "+d.detail:""));return}
    const hc=holeCount();
    slots.fill(null);const seen=new Set();
    (d.hole||[]).slice(0,hc).forEach((t,i)=>{const c=parse(t);if(c!=null&&!seen.has(c)){slots[i]=c;seen.add(c)}});
    (d.board||[]).slice(0,5).forEach((t,i)=>{const c=parse(t);if(c!=null&&!seen.has(c)){slots[hc+i]=c;seen.add(c)}});
    manual=false;sel=Math.max(0,slots.findIndex(x=>x==null));render();
    toast("Verify the cards below, tap any slot to fix it, then Calculate.");
  }catch(err){toast("Couldn't read the photo ("+(err&&err.message||err)+"). Try better light or enter cards manually.")}
}
$("cam").onchange=e=>{const f=e.target.files[0];if(!f)return;const p=$("prev");p.src=URL.createObjectURL(f);p.style.display="block";scan(f);e.target.value=""};
let stream=null;
$("live").onclick=async()=>{
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("vid").style.display=$("snap").style.display="none";return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920}},audio:false});
    $("vid").srcObject=stream;$("vid").style.display="block";$("snap").style.display="block";await $("vid").play()}
  catch(e){toast("Camera blocked. Allow camera access in Safari settings, or use Take photo.")}
};
$("snap").onclick=()=>{const v=$("vid"),c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  c.toBlob(b=>{const p=$("prev");p.src=URL.createObjectURL(b);p.style.display="block";scan(b)},"image/jpeg",.9)};
render();
</script>
</body>
